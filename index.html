<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cadastro - MotorHub</title>

</head>

<body>

    <header id="topo">

        <h1 id="logo">MotorHub</h1>
        <p id="subtitulo">Seu hub automotivo favorito.</p>

    </header>

    <main class="formulario-container">

        <form action="teladelogin.html">

            <h2>Cadastro</h2>
            <p>Preencha os dados para criar sua conta.</p>

            <div class="area-input">

                <label for="nome">Nome</label>

                <div class="input">

                    <i class="fa-solid fa-user"></i>
                    <input id="nome" placeholder="Nome" type="text" name="nome" required>

                </div>

            </div>
            
            <div class="area-input">

                <label for="sobrenome">Sobrenome</label>

                <div class="input">

                    <i class="fa-solid fa-user"></i>
                    <input id="sobrenome" placeholder="Sobrenome" type="text" name="sobrenome" required>

                </div>
            
            </div>

            <div class="area-input">

                <label for="email">E-mail</label>

                <div class="input">
                    
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" placeholder="E-mail" type="email" name="email" required>

                </div>

            </div>

            <div class="area-input">

                <label for="senha">Senha</label>

                <div class="input">

                    <i class="fa-solid fa-lock"></i>
                    <input id="senha" placeholder="Senha" type="password" name="senha" required>

                </div>

            </div>
            
            <div class="area-input">

                <label for="confirmarsenha">Confirmar senha</label>

                <div class="input">

                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirmar senha" required>

                </div>

            </div>
           
            <div class="area-input">

                <label for="datadenascimento">Data de nascimento</label>

                <div class="input">

                    <input id="datadenascimento" type="date" name="datadenascimento" required>

                </div>

            </div>
            
            
            <div class="termos">

                <input type="checkbox" id="termos" required>
                <label for="termos">Aceito os termos de uso</label>
                
            </div>
            
            <div class="area-botao-cadastro">

                <button type="submit" class="botao-cadastro">Fazer cadastro</button>

            </div>

            <div class="fazerlogin">

                <p>Já possui conta? </p>
                <a href="teladelogin.html">Fazer Login</a>

            </div>
            
        </form>

    </main>

</body>

</html>
