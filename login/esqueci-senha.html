<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Esqueci minha senha - MotorHub</title>

</head>

<body>

    <header class="topo">

        <h1 id="logo">MotorHub</h1>
        <p id="subtitulo">Seu hub automotivo favorito.</p>
        
    </header>

    <main class="formulario-container">

        <form action="../index.html">
            
            <h2>Esqueci minha senha</h2>
            <p>Para redefinir sua senha, informe o e-mail cadastrado na sua conta e lhe enviaremos um link com as intruções.</p>

            <div class="area-input">

                <label for="email">E-mail</label>

                <div class="input">

                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" placeholder="E-mail" type="email" name="email" required>

                </div>
                
            </div>

            <div class="area-enviarlink">
                
               <button type="submit" class="botao-enviarlink">Enviar link</button>

            </div>

            <a href="../index.html" class="cancelar">Cancelar</a>

        </form>

    </main>

</body>

</html>
