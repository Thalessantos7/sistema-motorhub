<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Registro de Veículo - MotorHub</title>

</head>

<body>

    <header class="topo">

        <h1 class="logo">MotorHub</h1>
        <p class="subtitulo">Seu hub automotivo favorito.</p>

    </header>

    <main class="formulario-container">

        <form action="meus-veiculos.html">

            <h2>Registro de Veículo</h2>
            <p>Preencha os dados para registrar seu veículo no sistema.</p>

            <div class="area-input">

                <label for="marca">Marca</label>

                <div class="input">

                    <input id="marca" placeholder="Marca" type="text" name="marca" required>

                </div>

            </div>
            
            <div class="area-input">

                <label for="modelo">Modelo</label>

                <div class="input">

                    <input id="modelo" placeholder="Modelo" type="text" name="modeo" required>

                </div>
            
            </div>

            <div class="area-input">

                <label for="placa">Placa</label>

                <div class="input">
                    
                    <input id="placa" placeholder="Placa" type="text" name="placa" required>

                </div>

            </div>

            <div class="area-input">

                <label for="quilometragem">Quilometragem</label>

                <div class="input">

                    <input id="quilometragem" placeholder="Quilometragem" type="text" name="quilometragem" required>

                </div>

            </div>
            
            <div class="container-registrar-veiculo">
                
                <button type="submit" class="registrar-veiculo">Registrar veículo</button>

            </div>

            <a href="meus-veiculos.html" class="cancelar">Cancelar</a>
            
        </form>

    </main>

</body>

</html>
