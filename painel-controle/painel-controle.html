<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle da Oficina</title>
    <link rel="stylesheet" href="painel-controle.css">

</head>

<body>

    <header class="topo">

        <h1>MotorHub</h1>
        <h2>Painel de Controle da Oficina</h2>

    </header>

    <main>

        <div class="container">

            <div class="cards">

                <div class="card">

                    <h2>Em aberto</h2>

                    <div class="value">0</div>

                    <div class="acoes">

                        <button class="botoes-ordens" onclick="diminuir(this)">−</button>
                        <button class="botoes-ordens" onclick="aumentar(this)">+</button>

                    </div>

                </div>

                <div class="card">

                    <h2>Concluídos</h2>

                    <div class="value success">0</div>

                    <div class="acoes">

                        <button class="botoes-ordens" onclick="diminuir(this)">−</button>
                        <button class="botoes-ordens" onclick="aumentar(this)">+</button>

                    </div>

                </div>

                <div class="card">

                    <h2>Atrasados</h2>

                    <div class="value alert">0</div>

                    <div class="acoes">

                        <button class="botoes-ordens" onclick="diminuir(this)">−</button>
                        <button class="botoes-ordens" onclick="aumentar(this)">+</button>

                    </div>

                </div>

            </div>

            <button class="botao-sair">Sair</button>

        </div>

    </main>

    <script src="../script.js"></script>

    <script>

        verificarAcesso("oficina")

    </script>

</body>

</html>
