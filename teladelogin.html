<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Login - MotorHub</title>

</head>

<body>

    <header id="topo">

        <h1 id="logo">MotorHub</h1>
        <p id="subtitulo">Seu hub automotivo favorito.</p>
        
    </header>

    <main>

        <form action="paginainicial.html">
            
            <h2>Login</h2>
            <p>Faça login para acessar sua conta.</p>

            <div class="area-input">

                <label for="email">E-mail</label>

                <div class="input">

                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" placeholder="E-mail" type="email" name="email" required>

                </div>
                
            </div>
            
            <div class="area-input">

                <label for="senha">Senha</label>

                <div class="input">

                    <i class="fa-solid fa-lock"></i>
                    <input id="senha" placeholder="Senha" type="password" name="senha" required>

                </div>
                
            </div>
            
            <div class="lembrar">

                <input type="checkbox" id="lembrar">
                <label for="lembrar">Lembrar de mim</label>

            </div>

            <div class="area-botao-login">

               <button type="submit" class="botao-login">Fazer login</button>

            </div>

            <div class="cadastrar-se">

                <p>Não tem conta? </p>
                <a href="index.html">Cadastre-se</a>

            </div>

            <a href="#" class="esqueci-senha">Esqueci minha senha</a>

        </form>

    </main>

</body>

</html>
